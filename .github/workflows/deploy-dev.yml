name: Build and deploy DEV image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      vars.GCP_DEPLOYMENT_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Resolve tested commit
        id: revision
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Validate deployment template configuration
        shell: bash
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          ARTIFACT_REGISTRY_HOST: ${{ vars.ARTIFACT_REGISTRY_HOST }}
          ARTIFACT_PROJECT_ID: ${{ vars.ARTIFACT_PROJECT_ID }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
          CONTAINER_IMAGE: ${{ vars.CONTAINER_IMAGE }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
          DB_URL: ${{ vars.DB_URL }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD_SECRET: ${{ vars.DB_PASSWORD_SECRET }}
        run: |
          missing=()
          for name in WORKLOAD_IDENTITY_PROVIDER DEPLOY_SERVICE_ACCOUNT ARTIFACT_REGISTRY_HOST \
            ARTIFACT_PROJECT_ID GCP_PROJECT_ID GCP_REGION ARTIFACT_REPOSITORY CONTAINER_IMAGE CLOUD_RUN_SERVICE \
            CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT \
            DB_URL DB_USERNAME DB_PASSWORD_SECRET; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "Missing GitHub Environment variables: ${missing[*]}" >&2
            exit 1
          fi

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the immutable image
        shell: bash
        env:
          IMAGE: ${{ vars.ARTIFACT_REGISTRY_HOST }}/${{ vars.ARTIFACT_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.CONTAINER_IMAGE }}:${{ steps.revision.outputs.sha }}
        run: |
          gcloud auth configure-docker "${{ vars.ARTIFACT_REGISTRY_HOST }}" --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy tested image to DEV
        shell: bash
        env:
          IMAGE: ${{ vars.ARTIFACT_REGISTRY_HOST }}/${{ vars.ARTIFACT_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.CONTAINER_IMAGE }}:${{ steps.revision.outputs.sha }}
        run: >-
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}"
          --image="$IMAGE"
          --project="${{ vars.GCP_PROJECT_ID }}"
          --region="${{ vars.GCP_REGION }}"
          --service-account="${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}"
          --set-env-vars="SPRING_PROFILES_ACTIVE=dev,DB_URL=${{ vars.DB_URL }},DB_USERNAME=${{ vars.DB_USERNAME }}"
          --set-secrets="DB_PASSWORD=${{ vars.DB_PASSWORD_SECRET }}:latest"
          --quiet
