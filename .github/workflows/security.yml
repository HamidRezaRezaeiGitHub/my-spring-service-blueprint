name: Dependency Security

on:
  pull_request:
    branches: [master]
    paths:
      - pom.xml
      - .github/workflows/security.yml
  push:
    branches: [master]
    paths:
      - pom.xml
      - .github/workflows/security.yml
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Fail on high-severity dependency findings
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          dependency_check_args=(
            -B
            org.owasp:dependency-check-maven:13.0.0:check
            -DfailBuildOnCVSS=8
            -DskipTestScope=false
          )

          if [[ -n "$NVD_API_KEY" ]]; then
            dependency_check_args+=("-DnvdApiKeyEnvironmentVariable=NVD_API_KEY")
          else
            echo "::notice::NVD_API_KEY is not configured; using the slower public NVD rate limit."
            dependency_check_args+=("-DnvdApiDelay=8000")
          fi

          ./mvnw "${dependency_check_args[@]}"

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore
          retention-days: 14
