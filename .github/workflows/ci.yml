name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Test, package, and build image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Run full PostgreSQL-backed test suite
        run: ./mvnw -B test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Package executable JAR
        run: ./mvnw -B package -DskipTests

      - name: Verify executable JAR without assuming its filename
        shell: bash
        run: |
          jar_path="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print -quit)"
          test -n "$jar_path"
          test -s "$jar_path"
          echo "Verified $jar_path"

      - name: Build credential-free container image
        run: docker build --tag spring-service-blueprint:${{ github.sha }} .

      - name: Lint wiki
        run: ai/scripts/wiki-lint.sh
