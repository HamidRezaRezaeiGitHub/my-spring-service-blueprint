spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  authentication:
    provider: ${AUTHENTICATION_PROVIDER:noop}
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    service-account-key-path: ${FIREBASE_SERVICE_ACCOUNT_KEY_PATH:}
  security:
    enabled: true
  storage:
    provider: ${STORAGE_PROVIDER:noop}
    bucket: ${STORAGE_BUCKET:}
