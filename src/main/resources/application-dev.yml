spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/application}
    username: ${DB_USERNAME:application}
    password: ${DB_PASSWORD:application}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  authentication:
    provider: ${AUTHENTICATION_PROVIDER:noop}
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    service-account-key-path: ${FIREBASE_SERVICE_ACCOUNT_KEY_PATH:}
  storage:
    provider: ${STORAGE_PROVIDER:noop}
    bucket: ${STORAGE_BUCKET:}
