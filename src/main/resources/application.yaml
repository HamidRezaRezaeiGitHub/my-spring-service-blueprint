spring:
  application:
    name: my-spring-service-blueprint
  autoconfigure:
    exclude:
      # This API authenticates exclusively through its provider-backed Bearer filter.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      # PostgreSQL is mandatory, so DevTools must not try to shut down an inferred embedded database.
      - org.springframework.boot.devtools.autoconfigure.DevToolsDataSourceAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    model:
      audio:
        speech: none
        transcription: none
      chat: none
      embedding: none
      image: none
      moderation: none
    mcp:
      server:
        enabled: false
        # Tool callbacks are registered explicitly; the reflective scanner is redundant and noisy when MCP is off.
        annotation-scanner:
          enabled: false

springdoc:
  # Local API documentation is intentionally enabled; cloud profiles can override these values.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  ai:
    max-prompt-length: 4000
  authentication:
    provider: noop
  firebase:
    enabled: false
  storage:
    provider: noop
    max-file-size: 10485760
    signed-url-duration: 15m
